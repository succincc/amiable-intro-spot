name: boards

# Postings from the smaller hiring systems — BambooHR, JazzHR, Recruitee,
# Pinpoint, Teamtailor — for every employer the resolver has placed on one.
# Each publishes its openings at a fixed public address; this reads those
# lists and saves the postings the owner's search wants. No browser, nothing
# signed in to.
#
# Free: public addresses and a public-repository runner.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Save postings (true), or only report (false)"
        required: false
        default: "false"

concurrency:
  group: applypilot-boards
  cancel-in-progress: false

jobs:
  boards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read the boards
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
          APPLY: ${{ github.event.inputs.apply || 'false' }}
        run: node forusers.mjs boards.mjs
