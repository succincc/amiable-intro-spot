name: cleanup

# Removes earlier runs: what they printed, and the record of them, which
# names the commit each ran from. Started by hand.

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete every finished run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          gone=0; kept=0
          for id in $(gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100" --jq '.workflow_runs[].id'); do
            [ "$id" = "$RUN_ID" ] && continue
            if gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1; then gone=$((gone + 1)); else kept=$((kept + 1)); fi
          done
          echo "runs deleted: $gone; not deletable: $kept"
