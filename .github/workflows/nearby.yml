name: nearby

# The employers around the owner, from the open map: see nearby.mjs. Weekly,
# from the clock.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Save the employers found (true), or only report (false)"
        required: false
        default: "false"

concurrency:
  group: applypilot-nearby
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nearby:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ask the map
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
          APPLY: ${{ github.event.inputs.apply == 'true' }}

        run: node nearby.mjs
