name: tenancy

# How the database is put together, and whether every row has an owner:
# see tenancy.mjs. Started by hand, after a workspace step is applied.

on:
  workflow_dispatch:

concurrency:
  group: applypilot-tenancy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tenancy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Describe the database
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: node tenancy.mjs
