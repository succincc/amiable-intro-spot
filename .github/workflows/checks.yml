name: checks

# Every push is tested before anything runs on it for real: the applier's
# rules, the two fixture applications sent start to finish against forms kept
# in this repository, and the panel's own tests and types. A round already
# refuses to send anything when its checks fail; this says so at the push,
# an hour sooner, with the commit's name on it.
#
# Free: a public-repo runner. Nothing here reads the database or a mailbox.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: applypilot-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  applier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore Playwright + Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/pw/node_modules
          key: pw-1.49.0-${{ runner.os }}
      - name: Install Playwright + Chromium
        run: |
          set -euo pipefail
          PW_DIR="$HOME/pw"
          mkdir -p "$PW_DIR"
          cd "$PW_DIR"
          if [ ! -d node_modules/playwright ]; then
            npm init -y >/dev/null
            npm install --no-audit --no-fund playwright@1.49.0
          fi
          npx playwright install --with-deps chromium
          ln -sfn "$PW_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Every script parses
        run: for f in *.mjs; do node --check "$f"; done
      - name: Unit checks
        run: node unit.mjs
      - name: Fixture applications
        run: node selftest.mjs

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Types
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bunx vitest run
