name: answers

# Started when the profile is saved in the panel. Every waiting question is
# put to the profile again and answered where it now can be, saved answers
# the profile has overtaken (a link, a citizenship) are brought in line, and
# applications that had stopped on an unanswered question are offered again.
# No application is sent from here.

on:
  repository_dispatch:
    types: [answers]
  workflow_dispatch:

concurrency:
  group: applypilot-answers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  answers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: The applier's one dependency, without its browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        # In its own folder, as the applying job does: the panel's own
        # package list sits at the root and is not this job's business.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/pw" && cd "$HOME/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.0
          ln -sfn "$HOME/pw/node_modules" "$GITHUB_WORKSPACE/node_modules"
      - name: Go through the questions
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
          ANSWERS_ONLY: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          DRY_RUN: "true"
        run: node forusers.mjs apply.mjs
