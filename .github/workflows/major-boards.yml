name: major-boards

# Job discovery for LinkedIn, Indeed, and ZipRecruiter.
# Uses each user's configured sources, titles, exclusions, and optional saved
# browser sessions in site_accounts. Runs on the free public-repo runner with
# the same cached Playwright + Chromium setup as apply.yml.

on:
  repository_dispatch:
    types: [discover-boards]
  workflow_dispatch:
    inputs:
      apply:
        description: "Save discovered postings (true), or dry report (false)"
        required: false
        default: "true"
      platforms:
        description: "Comma-separated subset (linkedin,indeed,ziprecruiter). Blank for all enabled."
        required: false
        default: ""

concurrency:
  group: applypilot-major-boards
  cancel-in-progress: false

jobs:
  major-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore Playwright + Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/pw/node_modules
          key: pw-1.49.0-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: |
          set -euo pipefail
          PW_DIR="$HOME/pw"
          mkdir -p "$PW_DIR"
          cd "$PW_DIR"
          if [ ! -d node_modules/playwright ]; then
            npm init -y >/dev/null
            npm install --no-audit --no-fund playwright@1.49.0
          fi
          npx playwright install --with-deps chromium
          ln -sfn "$PW_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Discover LinkedIn, Indeed, and ZipRecruiter postings
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
          APPLY: ${{ github.event.inputs.apply || github.event.client_payload.apply || 'true' }}
          PLATFORMS: ${{ github.event.inputs.platforms || github.event.client_payload.platforms || '' }}
        run: node forusers.mjs major-boards.mjs

      - name: Measure distances for new postings
        if: always()
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: node forusers.mjs measure.mjs || true