name: phones

# The location's own published phone number for postings applied to, from
# OpenStreetMap: see phones.mjs. Nothing is called from here.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Save numbers (true), or only report (false)"
        required: false
        default: "false"

concurrency:
  group: applypilot-phones
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  phones:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Find numbers
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
          APPLY: ${{ github.event.inputs.apply == 'true' }}
        run: node forusers.mjs phones.mjs
