name: audit

# The applications on record, held against the evidence for each: receipts,
# replies, and whether any job was applied to twice. Counts and shapes only.

# Fails (and GitHub writes to the owner) when the record contradicts its
# evidence: a job marked interview or offer with no such mail, or a job sent
# twice in the last two days.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "all, or only the supply report"
        type: choice
        required: false
        default: "all"
        options: ["all", "supply"]
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hold the record against the evidence
        if: github.event.inputs.only != 'supply'
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: |
          set -o pipefail
          node forusers.mjs audit.mjs | tee "$RUNNER_TEMP/audit.txt"
      - name: The resume as it is against the resume as written, same postings
        if: always() && github.event.inputs.only != 'supply'
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: node forusers.mjs benchmark.mjs
      - name: What postings ask for that the profile does not show, put to the person
        if: always() && github.event.inputs.only != 'supply'
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: node forusers.mjs gaps.mjs
      # Which sources and which employers the qualified postings came from.
      - name: Where the qualified postings come from
        if: always()
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: |
          set -o pipefail
          node forusers.mjs supply.mjs | tee "$RUNNER_TEMP/supply.txt"
      # Last, so that the end of the log is the part most worth reading: the
      # owner's lines of each report, one line each. (Both files have been
      # through the nets already; this prints nothing they did not.)
      - name: In one line each
        if: always()
        run: |
          for f in audit supply; do
            [ -f "$RUNNER_TEMP/$f.txt" ] || continue
            echo "---- $f, the owner's ----"
            sed '/^==== person 2 /,$d' "$RUNNER_TEMP/$f.txt" | grep -E "^(DIGEST|SUPPLY|WRONG|discovery, last|discovery, set aside|engine parts|  by what the upgrade|letters from|on record as sent|the record against itself|submits nothing confirmed|  confidence|sources switched|questions waiting|employers on file|  not placed|employers whose own list|employers by how|postings, 7 days|qualified and not sent|remote postings|  remote, qualified|  from employers already|  sent [0-9]+ of them)|^    [a-z][a-z ,()0-9-]{1,48}: [0-9]+ / [0-9]+ / |^    [a-z]+: [0-9]+: " | cut -c1-600 || true
          done
          echo "---- everyone else, the digests ----"
          cat "$RUNNER_TEMP/audit.txt" "$RUNNER_TEMP/supply.txt" 2>/dev/null | sed -n '/^==== person 2 /,$p' | grep -E "^(==== person|DIGEST|SUPPLY|WRONG)" | cut -c1-500 || true
