name: audit

# The applications on record, held against the evidence for each: receipts,
# replies, and whether any job was applied to twice. Counts and shapes only.

# Fails (and GitHub writes to the owner) when the record contradicts its
# evidence: a job marked interview or offer with no such mail, or a job sent
# twice in the last two days.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "all, or only the supply report"
        type: choice
        required: false
        default: "all"
        options: ["all", "supply"]
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Hold the record against the evidence
        if: github.event.inputs.only != 'supply'
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: |
          set -o pipefail
          node forusers.mjs audit.mjs | tee "$RUNNER_TEMP/audit.txt"
      - name: The resume as it is against the resume as written, same postings
        if: always() && github.event.inputs.only != 'supply'
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: node forusers.mjs benchmark.mjs
      - name: What postings ask for that the profile does not show, put to the person
        if: always() && github.event.inputs.only != 'supply'
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: node forusers.mjs gaps.mjs
      - name: In one line each
        if: always() && github.event.inputs.only != 'supply'
        run: |
          grep -hE "^(DIGEST|WRONG|discovery|engine parts|  by what the upgrade|letters from|==== person)|^  by source|^    [^:]{1,24}: [0-9]+ / [0-9]+ / " "$RUNNER_TEMP/audit.txt" || true
      # Last, so that the end of the log is the part most worth reading:
      # which sources and which employers the qualified postings came from.
      - name: Where the qualified postings come from
        if: always()
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
        run: node forusers.mjs supply.mjs
