name: jobposting

# Postings read from employers' own careers sites, by the structured data
# they publish for search engines (the same data Google's job search is built
# from). For employers the resolver could not place on a taught portal.
#
# Nothing is signed in to and no search engine is asked anything.
#
# Free: a public-repo runner and public pages.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Save postings (true), or only report (false)"
        required: false
        default: "false"
      max:
        description: "How many employer sites to read"
        required: false
        default: "120"
      urls:
        description: "Optional: read these instead — Name|https://…,Name|https://…"
        required: false
        default: ""
  # No schedule yet: it reports only until a test run shows what it finds.

concurrency:
  group: applypilot-jobposting
  cancel-in-progress: false

jobs:
  jobposting:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The same isolated install and cache the applier uses.
      - name: Restore Playwright + Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/pw/node_modules
          key: pw-1.49.0-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: |
          set -euo pipefail
          PW_DIR="$HOME/pw"
          mkdir -p "$PW_DIR"
          cd "$PW_DIR"
          if [ ! -d node_modules/playwright ]; then
            npm init -y >/dev/null
            npm install --no-audit --no-fund playwright@1.49.0
          fi
          npx playwright install --with-deps chromium
          ln -sfn "$PW_DIR/node_modules" "$GITHUB_WORKSPACE/node_modules"

      - name: Read employer sites
        env:
          SUPABASE_URL: https://inqhfkshqndkxyztzita.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QK4kidijM8nk46uK6L22Qw_XA0RQu5U
          APPLYPILOT_EMAIL: ${{ secrets.APPLYPILOT_EMAIL }}
          APPLYPILOT_PASSWORD: ${{ secrets.APPLYPILOT_PASSWORD }}
          APPLY: ${{ github.event.inputs.apply == 'true' }}
          MAX_EMPLOYERS: ${{ github.event.inputs.max || '120' }}
          ONLY_URLS: ${{ github.event.inputs.urls }}
        run: node jobposting.mjs
