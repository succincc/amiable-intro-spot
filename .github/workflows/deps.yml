name: deps

# The dependency advisories, and whether the upgrades that clear them leave
# the app building and its tests passing. Nothing is committed: this is the
# trial, on the runner's own copy, before anyone asks for the upgrade.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "true: also put the upgraded lockfile on the branch deps-audit-fix (never on main)"
        default: "false"

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Advisories as the code stands
        run: bun audit 2>&1 | tail -3 || true
      - name: Upgrade within the ranges already allowed
        run: bun audit fix 2>&1 | tail -15 || true
      - name: Advisories after
        run: bun audit 2>&1 | grep -vE "^\s*$" | sed 's/ - https.*//' | tail -40 || true
      - name: What changed
        run: git diff --stat | tail -5
      - name: Types
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: |
          set -o pipefail
          bunx vitest run 2>&1 | grep -E "Tests|Test Files|FAIL"
      - name: Build
        run: |
          set -o pipefail
          bun run build 2>&1 | tail -4
      - name: The upgraded lockfile, on its own branch
        if: github.event.inputs.branch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B deps-audit-fix
          git add bun.lock
          git commit -m "Dependency upgrades within the ranges already allowed (bun audit fix); types, tests and build passed on the runner"
          git push -f origin deps-audit-fix
